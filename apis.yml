  detail: 'ABABA runs two real first-party hosts — a Bubble.io end-user application at ababa.co.jp whose
    robots.txt is Disallow:/ for every user agent, and an undocumented Go API at api.ababa.co.jp (AWS
    ap-northeast-1, permissive CORS, /health 200) that backs it — but the company publishes no developer
    program at all: every OpenAPI/Swagger/GraphQL/agent-card/apis.json path on all three hosts 404s against
    a clean negative control, api./docs./developer subdomains either 404 or do not resolve, and the corporate
    site''s own sitemap lists only company, article, whitepaper, news, privacy and job-posting-policy
    routes with nothing developer-facing.'
