aid: ababa
name: ABABA
description: 'ABABA (株式会社ABABA) is a Tokyo-based Japanese HR technology company operating a new-graduate
  direct-recruiting platform built on an unusual premise: only students who have already reached the FINAL
  interview stage at another company may register, and each submits evidence of that selection history,
  so every candidate in the database arrives pre-qualified by someone else''s hiring bar. Employers then
  scout those near-miss finalists into abbreviated selection flows — the company reports that 94% of adopting
  employers waive the entry sheet or the first interview for an ABABA candidate. A second product, REALME,
  runs AI mock interviews and matching. Founded 19 October 2020 and led by co-representatives Shunki Kubo
  (CEO) and Tatsuya Nakai, ABABA raised a 1.25 billion yen Series B in March 2025 led by DBJ Capital (1.82
  billion yen total to date) and reported passing 3,000 cumulative adopting companies in November 2025.
  The product ships purely as an end-user web application: ABABA publishes no developer portal, API documentation,
  SDK, webhook catalog or machine-readable specification of any kind.'
